<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fire TV Cast – Sound check</title>
<link rel="stylesheet" href="tv.css">
<style>
  .sc { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; }
  .sc-inner { width: 76vw; }
  .sc h1 { font-size: 3.6vw; margin: 0 0 1vw; }
  .sc .big { font-size: 9vw; font-weight: 700; color: var(--accent); margin: 1vw 0; min-height: 1.2em; }
  .sc .what { font-size: 2.2vw; color: var(--fg); min-height: 1.4em; }
  .sc .lead { font-size: 1.8vw; }
  .sc .btns { display: flex; gap: 2vw; margin-top: 2vw; }
  .sc pre { font: 1.1vw/1.5 ui-monospace, "Roboto Mono", monospace; color: var(--muted); white-space: pre-wrap; margin-top: 2vw; max-height: 22vh; overflow: hidden; }
</style>
</head>
<body>
<div class="sc">
  <div class="sc-inner">
    <h1>Sound check</h1>
    <p class="lead" id="intro">This plays <b>4 beeps</b>, one at a time, each made a different way. Turn the TV volume up, press the <b>middle button</b> on the remote, and note which numbers you <b>hear</b>.</p>
    <div class="big" id="big"></div>
    <div class="what" id="what"></div>
    <div class="btns">
      <button id="go" class="start" autofocus>Start sound check</button>
      <button id="back" class="start hidden">Back to casting</button>
    </div>
    <pre id="log"></pre>
  </div>
</div>
<script src="soundcheck.js"></script>
</body>
</html>
