name: Build Mac helper

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: mac-helper/go.mod
          cache-dependency-path: mac-helper/go.sum

      - name: Cache FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: mac-helper/build/ffmpeg
          key: ffmpeg-${{ hashFiles('mac-helper/packaging/build-ffmpeg.sh') }}

      - name: Build FFmpeg (only when the build script changes)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: mac-helper/packaging/build-ffmpeg.sh mac-helper/build/ffmpeg

      - name: Test
        working-directory: mac-helper
        run: go test ./...

      - name: Build universal app
        working-directory: mac-helper
        run: |
          set -euo pipefail
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.updateRepo=${GITHUB_REPOSITORY}"
          GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o build/arm64 .
          GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o build/amd64 .

          APP="build/Fire TV Cast.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/FireTVCast" build/arm64 build/amd64
          sed "s/__VERSION__/${VERSION}/g" packaging/Info.plist > "$APP/Contents/Info.plist"

          # Bundled FFmpeg for converting MKV and other files.
          cp build/ffmpeg/ffmpeg build/ffmpeg/ffprobe "$APP/Contents/MacOS/"
          cp build/ffmpeg/FFMPEG-LICENSE.txt build/ffmpeg/FFMPEG-SOURCE.txt "$APP/Contents/Resources/"
          codesign --force --sign - "$APP/Contents/MacOS/ffmpeg"
          codesign --force --sign - "$APP/Contents/MacOS/ffprobe"

          # App icon from the SVG logo.
          mkdir -p build/icon.iconset
          qlmanage -t -s 1024 -o build packaging/icon.svg >/dev/null 2>&1 || true
          if [ -f build/icon.svg.png ]; then
            for s in 16 32 128 256 512; do
              sips -z $s $s build/icon.svg.png --out build/icon.iconset/icon_${s}x${s}.png >/dev/null
              sips -z $((s*2)) $((s*2)) build/icon.svg.png --out build/icon.iconset/icon_${s}x${s}@2x.png >/dev/null
            done
            iconutil -c icns build/icon.iconset -o "$APP/Contents/Resources/AppIcon.icns"
          fi

          # Ad-hoc signature (no Apple developer account needed).
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"
          lipo -info "$APP/Contents/MacOS/FireTVCast"

          # Sanity checks: the app reports the version we just built, and the bundled
          # FFmpeg can actually convert an AC3 MKV.
          test "$("$APP/Contents/MacOS/FireTVCast" -version)" = "$VERSION"
          FF="$APP/Contents/MacOS/ffmpeg"
          "$FF" -version | head -1
          "$APP/Contents/MacOS/ffprobe" -version | head -1
          PROBE="$APP/Contents/MacOS/ffprobe"
          FRAG="frag_keyframe+empty_moov+default_base_moof"
          # MKV with AC3 5.1 sound -> copied H.264 + stereo AAC
          "$FF" -v error -i testdata/sample-ac3.mkv -map 0:0 -map 0:1 -c:v copy -c:a aac -b:a 192k -ac 2 -ar 48000 -movflags $FRAG -f mp4 build/t1.mp4
          test "$("$PROBE" -v error -show_entries stream=codec_name -of csv=p=0 build/t1.mp4 | tr '\n' ' ')" = "h264 aac "
          # Old AVI (MPEG-4 video, MP3 sound) -> H.264 via VideoToolbox + AAC
          "$FF" -v error -i testdata/sample-mpeg4.avi -map 0:0 -map 0:1 -c:v h264_videotoolbox -realtime 1 -allow_sw 1 -b:v 2M -pix_fmt yuv420p -c:a aac -ac 2 -movflags $FRAG -f mp4 build/t2.mp4
          test "$("$PROBE" -v error -show_entries stream=codec_name -of csv=p=0 build/t2.mp4 | tr '\n' ' ')" = "h264 aac "
          echo "FFmpeg conversion checks passed"

          cd build && ditto -c -k --keepParent "Fire TV Cast.app" ../../FireTVCast-Mac.zip
          # Files used by the app's automatic updater.
          COPYFILE_DISABLE=1 tar -czf ../../FireTVCast-Mac-update.tar.gz "Fire TV Cast.app"
          SHA=$(shasum -a 256 ../../FireTVCast-Mac-update.tar.gz | cut -d' ' -f1)
          printf '{"version":"%s","sha256":"%s"}\n' "$VERSION" "$SHA" > ../../mac-version.json
          cat ../../mac-version.json

      - uses: actions/upload-artifact@v4
        with:
          name: FireTVCast-Mac
          path: FireTVCast-Mac.zip

      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: |
            FireTVCast-Mac.zip
            FireTVCast-Mac-update.tar.gz

      # Published last, so running apps only see the new version once its files are up.
      - name: Publish version info for automatic updates
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: mac-version.json
